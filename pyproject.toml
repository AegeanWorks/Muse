[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-aikit"
version = "0.1.0"
description = "Prompt-driven AI music creation with an automated listener that scores theme fit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
muse = "muse.cli:main"

[tool.setuptools]
packages = ["muse", "muse.providers", "muse.judges"]
