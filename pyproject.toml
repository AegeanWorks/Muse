[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-aikit"
version = "0.14.4"
description = "Prompt-driven AI music creation with an automated listener that scores theme fit."
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-AL-1.1"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
muse = "muse.cli:main"

[tool.setuptools]
packages = ["muse", "muse.providers", "muse.judges"]
